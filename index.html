<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Study App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="public/icons/icon-192.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 750: '#2c2c2e', 850: '#1c1c1e', 900: '#111111' } } } }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-white bg-black selection:bg-blue-500 selection:text-white">
    
    <canvas id="confetti-canvas"></canvas>

    <header class="fixed top-0 w-full z-30 glass safe-top transition-transform duration-300 border-b-0" id="main-header">
        <div class="px-5 py-3 flex justify-between items-center h-14">
            <h1 id="page-title" class="text-xl font-bold tracking-tight text-white">Dashboard</h1>
            <div id="header-actions"></div> 
        </div>
    </header>

    <main id="app-container" class="flex-1 overflow-y-auto overflow-x-hidden pt-28 pb-64 px-4 no-scrollbar w-full">
        <div id="view-dashboard" class="view-section max-w-xl mx-auto"></div>
        <div id="view-library" class="view-section hidden max-w-xl mx-auto"></div>
        <div id="view-reader" class="view-section hidden fixed inset-0 z-50 bg-[#000000] overflow-y-auto no-scrollbar"></div>
    </main>

    <div id="selection-tooltip" class="hidden fixed z-[60] bg-gray-800 text-white border border-gray-700 rounded-full px-4 py-2 shadow-xl flex gap-4 items-center transform -translate-x-1/2 left-1/2 bottom-32 transition-all">
        <button onclick="app.reader.saveHighlight()" class="font-medium text-sm flex items-center gap-2">
            <i class="fas fa-highlighter text-yellow-400"></i> Notiz speichern
        </button>
    </div>

    <div id="mini-player" class="hidden fixed left-0 right-0 z-40 bg-[#1c1c1e] border-t border-white/10 shadow-[0_-4px_20px_rgba(0,0,0,0.6)] transform transition-transform duration-300 translate-y-full" style="bottom: calc(4rem + env(safe-area-inset-bottom));">
        
        <div class="max-w-xl mx-auto px-4 py-2 h-16 grid grid-cols-[1fr_auto_1fr] items-center gap-2">
            
            <div class="min-w-0 flex flex-col justify-center pr-2">
                <p id="player-title" class="text-xs font-bold truncate text-white leading-tight mb-0.5">Lade...</p>
                <div class="flex items-center gap-1.5 opacity-60">
                    <i class="fas fa-podcast text-[10px]"></i>
                    <span class="text-[10px] truncate">Podcast</span>
                </div>
            </div>

            <div class="flex items-center justify-center gap-6">
                 <button id="btn-skip-back" class="text-gray-400 hover:text-white transition active:scale-90 p-2">
                    <i class="fas fa-undo-alt text-sm"></i>
                 </button>
                 
                 <button id="btn-play-pause" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-lg shadow-white/10">
                    <i class="fas fa-play text-sm ml-0.5"></i>
                 </button>
                 
                 <button id="btn-skip-fwd" class="text-gray-400 hover:text-white transition active:scale-90 p-2">
                    <i class="fas fa-redo-alt text-sm"></i>
                 </button>
            </div>

            <div class="flex justify-end">
                 <button onclick="app.player.close()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/10 transition active:scale-90">
                    <i class="fas fa-times text-base"></i>
                 </button>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-gray-800">
             <div id="progress-bar" class="h-full bg-blue-500 w-0 transition-all duration-100"></div>
        </div>
        
        <audio id="audio-element" class="hidden"></audio>
    </div>

    <nav class="fixed bottom-0 w-full z-50 bg-[#000000]/90 backdrop-blur-xl border-t border-white/10 safe-bottom">
        <div class="flex justify-around items-center h-16 max-w-xl mx-auto">
            <button onclick="app.ui.switchTab('dashboard')" class="nav-btn active flex-1 h-full flex flex-col items-center justify-center gap-1.5 text-blue-500 transition">
                <i class="fas fa-bolt text-xl"></i>
                <span class="text-[10px] font-semibold tracking-wide">Fokus</span>
            </button>
            <button onclick="app.ui.switchTab('library')" class="nav-btn flex-1 h-full flex flex-col items-center justify-center gap-1.5 text-gray-500 transition">
                <i class="fas fa-layer-group text-xl"></i>
                <span class="text-[10px] font-semibold tracking-wide">Bibliothek</span>
            </button>
        </div>
    </nav>
    
    <script src="src/js/modules/spaced-repetition.js"></script>
    <script src="src/js/modules/player.js"></script>
    <script src="src/js/modules/reader.js"></script>
    <script src="src/js/modules/ui.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
