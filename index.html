<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Study App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="public/icons/icon-192.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/flashcards.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 750: '#2c2c2e', 850: '#1c1c1e', 900: '#111111' } } } }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-white bg-black selection:bg-blue-500 selection:text-white">
    
    <canvas id="confetti-canvas"></canvas>

    <header class="fixed top-0 w-full z-30 glass safe-top transition-transform duration-300 border-b-0" id="main-header">
        <div class="px-5 py-3 flex justify-between items-center h-16">
            <h1 id="page-title" class="text-2xl font-bold tracking-tight text-white">Dashboard</h1>
            
            <div id="header-actions" class="flex items-center gap-2">
                <button onclick="window.location.reload()" class="text-gray-500 active:text-white transition active:rotate-180 duration-500">
                    <i class="fas fa-arrows-rotate"></i>
                </button>
            </div> 
        </div>
    </header>

    <main id="app-container" class="flex-1 overflow-hidden pt-0 pb-0 px-0 w-full h-full relative">
        
        <div id="scroll-wrapper" class="pt-32 pb-64 px-4 h-full overflow-y-auto no-scrollbar">
            <div id="view-dashboard" class="view-section max-w-xl mx-auto"></div>
            <div id="view-library" class="view-section hidden max-w-xl mx-auto"></div>
        </div>

        <div id="view-foryou" class="view-section hidden fixed inset-0 z-20 bg-black h-screen w-screen overflow-y-scroll snap-y snap-mandatory no-scrollbar pb-16">
        </div>

        <div id="view-reader" class="view-section hidden fixed inset-0 z-[100] bg-[#000000] overflow-y-auto no-scrollbar"></div>
        <div id="view-flashcards" class="view-section hidden fixed inset-0 z-[100] bg-[#000000] overflow-y-auto no-scrollbar flex flex-col"></div>
    </main>

    <div id="mini-player" class="hidden fixed left-0 right-0 z-40 bg-[#1c1c1e] border-t border-white/10 shadow-[0_-4px_20px_rgba(0,0,0,0.6)] transform transition-transform duration-300 translate-y-full" style="bottom: calc(5rem + env(safe-area-inset-bottom));">
        
        <div class="max-w-xl mx-auto px-4 py-2 h-20 relative flex items-center justify-between">
            
            <div class="flex-1 min-w-0 flex flex-col justify-center pr-20">
                <p id="player-title" class="text-sm font-bold truncate text-white leading-tight mb-0.5">Lade...</p>
                <div class="flex items-center gap-1.5 opacity-60">
                    <i class="fas fa-podcast text-[11px]"></i>
                    <span class="text-[11px] truncate uppercase tracking-wider font-bold">Podcast</span>
                </div>
            </div>

            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center gap-5">
                 <button id="btn-skip-back" class="text-gray-400 active:text-white p-2">
                    <i class="fas fa-undo-alt text-lg"></i>
                 </button>
                 
                 <button id="btn-play-pause" class="bg-white text-black rounded-full flex items-center justify-center active:scale-90 transition shadow-lg">
                    <i class="fas fa-play ml-1"></i>
                 </button>
                 
                 <button id="btn-skip-fwd" class="text-gray-400 active:text-white p-2">
                    <i class="fas fa-redo-alt text-lg"></i>
                 </button>
            </div>

            <div class="flex justify-end items-center gap-2 z-10">
                 <button id="btn-speed" class="text-sm font-bold text-gray-300 px-3 py-2 rounded-lg hover:bg-white/10">
                    1.0x
                 </button>

                 <button onclick="app.player.close()" class="w-10 h-10 flex items-center justify-center text-gray-500 active:text-white">
                    <i class="fas fa-times text-xl"></i>
                 </button>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-gray-800">
             <div id="progress-bar" class="h-full bg-blue-500 w-0 transition-all duration-100"></div>
        </div>
        
        <audio id="audio-element" class="hidden"></audio>
    </div>

    <nav class="fixed bottom-0 w-full z-50 bg-[#000000]/90 backdrop-blur-xl border-t border-white/10 safe-bottom">
        <div class="flex justify-around items-center h-20 max-w-xl mx-auto">
            <button onclick="app.ui.switchTab('dashboard')" class="nav-btn active flex-1 h-full flex flex-col items-center justify-center gap-1 text-blue-500">
                <i class="fas fa-bolt"></i>
                <span>Fokus</span>
            </button>
            
            <button onclick="app.ui.switchTab('foryou')" class="nav-btn flex-1 h-full flex flex-col items-center justify-center gap-1 text-gray-500">
                <div class="relative">
                    <i class="fas fa-play-circle transform scale-110"></i>
                </div>
                <span>4 You</span>
            </button>

            <button onclick="app.ui.switchTab('library')" class="nav-btn flex-1 h-full flex flex-col items-center justify-center gap-1 text-gray-500">
                <i class="fas fa-layer-group"></i>
                <span>Bibliothek</span>
            </button>
        </div>
    </nav>
    
    <script src="src/js/modules/spaced-repetition/spaced-repetition.js?v=38"></script>
    <script src="src/js/modules/player/player.js?v=5"></script>
    <script src="src/js/modules/player/player-ui.js?v=5"></script>
    <script src="src/js/modules/reader/reader.js?v=31"></script>
    <script src="src/js/modules/flashcards/flashcards.js?v=32"></script>
    <script src="src/js/modules/foryou/foryou.js"></script>
    <script src="src/js/modules/foryou/foryou-ui.js?v=29"></script>
    <script src="src/js/modules/foryou/foryou-video.js"></script>
    <script src="src/js/modules/ui/ui.js?v=21"></script>
    <script src="src/js/modules/ui/ui-dashboard.js?v=39"></script>
    <script src="src/js/modules/ui/ui-library.js?v=31"></script>
    <script src="src/js/modules/ui/ui-nav.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
