<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study PWA</title>
    <link rel="manifest" href="public/manifest.json">
    <link rel="apple-touch-icon" href="public/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body class="bg-gray-100 text-gray-900 h-screen flex flex-col overflow-hidden selection:bg-yellow-200">

    <header class="bg-white shadow-sm p-4 pt-12 safe-top">
        <h1 id="page-title" class="text-xl font-bold text-center">Dashboard</h1>
    </header>

    <main id="app-container" class="flex-1 overflow-y-auto p-4 pb-24 relative">
        <div id="view-dashboard" class="view-section"></div>
        <div id="view-library" class="view-section hidden"></div>
        <div id="view-reader" class="view-section hidden bg-white min-h-full rounded-lg shadow p-4"></div>
    </main>

    <div id="mini-player" class="bg-gray-900 text-white p-3 hidden transition-all duration-300 border-t border-gray-800 absolute bottom-16 left-0 w-full z-40">
        <div class="flex items-center justify-between">
            <div class="truncate w-1/2">
                <p id="player-title" class="text-sm font-bold truncate">Kein Titel</p>
                <p class="text-xs text-gray-400">Podcast</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="btn-skip-back" class="text-gray-400 hover:text-white"><i class="fas fa-undo-alt"></i> 10</button>
                <button id="btn-play-pause" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center"><i class="fas fa-play"></i></button>
                <button id="btn-skip-fwd" class="text-gray-400 hover:text-white">10 <i class="fas fa-redo-alt"></i></button>
                <button id="btn-speed" class="text-xs font-mono border border-gray-600 rounded px-1">1.0x</button>
            </div>
        </div>
        <audio id="audio-element" class="hidden"></audio>
    </div>

    <nav class="bg-white border-t border-gray-200 flex justify-around items-center h-16 safe-bottom absolute bottom-0 w-full z-50">
        <button onclick="app.ui.switchTab('dashboard')" class="nav-btn active flex flex-col items-center text-blue-600 w-1/3">
            <i class="fas fa-bolt text-xl mb-1"></i>
            <span class="text-xs">Fokus</span>
        </button>
        <button onclick="app.ui.switchTab('library')" class="nav-btn flex flex-col items-center text-gray-400 w-1/3">
            <i class="fas fa-layer-group text-xl mb-1"></i>
            <span class="text-xs">Bibliothek</span>
        </button>
    </nav>

    <script src="src/js/modules/spaced-repetition.js"></script>
    <script src="src/js/modules/player.js"></script>
    <script src="src/js/modules/reader.js"></script>
    <script src="src/js/modules/ui.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
